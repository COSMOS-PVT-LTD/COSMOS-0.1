name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-preview:
    name: macOS arm64 release preview (Python 3.11)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned preview environment
        run: python -m pip install -r requirements-release-macos.txt
      - name: Confirm architecture and run profile/package boundaries
        run: |
          test "$(uname -m)" = arm64
          python -m pytest -q tests/unit_tests/infrastructure/test_release_hardening.py tests/integration_tests/gui/test_release_preview_http.py
          python -m pip check
          python scripts/build_release_preview.py --output "$RUNNER_TEMP/cosmos-preview"
      - name: Check preview dependencies for known advisories
        run: |
          python -m venv "$RUNNER_TEMP/audit-tools"
          "$RUNNER_TEMP/audit-tools/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-tools/bin/python" -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" --strict
  cea:
    name: NASA CEA live integration (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-numerics.txt
            requirements-cea.txt
      - name: Install pinned NASA engine and development dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-cea.txt
      - name: Execute native solver regression and authenticated workflow
        run: |
          python -c "import cea; assert cea.__version__ == '3.3.4'"
          python -m pytest -q tests/unit_tests/plugins/test_nasa_cea_engine.py tests/unit_tests/api/test_cea_workflow.py tests/integration_tests/gui/test_cea_http.py
          python -m pytest -q tests/unit_tests/systems_layer/test_engine_operating.py tests/integration_tests/gui/test_engine_operating_http.py tests/unit_tests/physics/test_heated_nozzle.py tests/unit_tests/numerics/test_bounded_system.py
          python -m pytest -q tests/unit_tests/systems_layer/test_operating_sensitivity_native.py tests/integration_tests/gui/test_operating_validation_http.py tests/unit_tests/systems_layer/test_engineering_extensions.py tests/integration_tests/gui/test_engineering_extensions_http.py
          python scripts/smoke_nasa_cea_methalox.py
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-numerics.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Provision OCR backend and test fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --version

      - name: Run unit and integration tests
        run: python -m pytest

      - name: Set up Node for GUI workflow tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run GUI workflow regression tests
        run: node --test tests/js/*.test.cjs

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-numerics.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff (all production packages and tests)
        run: python -m ruff check core knowledge physics numerics systems simulation validation api gui infrastructure plugins tests tools

      - name: Mypy (Core, Physics, Numerics, Systems, API)
        run: python -m mypy core physics numerics systems api simulation validation knowledge/workspace/evidence_navigation.py infrastructure/release infrastructure/persistence
