<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COSMOS 0.1 — Audit Trail</title>
  <link rel="stylesheet" href="/assets/cosmos.css" />
</head>
<body class="cosmos-app cosmos-scrollable">
  <div class="app-frame page-shell">
    <header class="app-header">
      <button type="button" class="avatar" id="avatar" title="Double-click to edit profile" aria-label="Profile"></button>
      <div class="header-meta">
        <div class="header-context">
          <span class="context-primary">Audit Log</span>
          <span class="context-secondary">Compliance &amp; traceability</span>
        </div>
      </div>
      <button type="button" class="user-badge" id="user-badge">COSMOS</button>
    </header>
    <div class="app-body">
      <aside class="sidebar" aria-label="Primary navigation"></aside>
      <main class="content-area">
        <section class="workbench-detail">
          <div class="block-head audit-head">
            <div>
              <h1>Application Audit Log</h1>
              <p>Search, filter, and inspect COSMOS application events for traceability and compliance.</p>
            </div>
            <button type="button" class="cosmos-btn secondary" id="audit-refresh-btn">Refresh</button>
          </div>
          <div class="audit-dashboard" id="audit-dashboard"></div>
          <div class="audit-toolbar">
            <input type="search" id="audit-search" placeholder="Search events…" aria-label="Search audit events" />
            <select id="audit-user-filter" aria-label="Filter by user"><option value="">All users</option></select>
            <select id="audit-action-filter" aria-label="Filter by action"><option value="">All actions</option></select>
            <select id="audit-page-size" aria-label="Page size">
              <option value="25" selected>25 / page</option>
              <option value="50">50 / page</option>
              <option value="100">100 / page</option>
            </select>
          </div>
          <div class="admin-table-wrap">
            <table class="clean-table">
              <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>Detail</th></tr></thead>
              <tbody id="audit-body"></tbody>
            </table>
          </div>
          <div class="audit-pagination">
            <button type="button" class="cosmos-btn secondary" id="audit-prev">Previous</button>
            <span id="audit-page-summary">Page 1 of 1 · 0 records</span>
            <button type="button" class="cosmos-btn secondary" id="audit-next">Next</button>
          </div>
          <div class="audit-detail-panel" id="audit-detail" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <div class="status-bar in-frame" id="status-bar" role="status">
      <span class="status-indicator ready" aria-hidden="true"></span>
      <span class="status-bar-text">Audit trail</span>
      <span class="status-bar-meta">COSMOS 0.1</span>
    </div>
  </div>
  <script src="/assets/rbac.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/engineering-ux.js"></script>
  <script src="/assets/maharshi-popup.js"></script>
  <script>
    COSMOS.initAuditPage();
    document.getElementById("audit-refresh-btn")?.addEventListener("click", () => location.reload());
  </script>
</body>
</html>
