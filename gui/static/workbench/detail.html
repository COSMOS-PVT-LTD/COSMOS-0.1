<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COSMOS 0.1 — Workbench</title>
  <link rel="stylesheet" href="/assets/cosmos.css" />
</head>
<body class="cosmos-app">
  <div class="app-frame page-shell">
    <header class="app-header">
      <button type="button" class="avatar" id="avatar" title="Edit profile photo" aria-label="Edit profile photo"></button>
      <div class="header-meta">
        <div class="header-pill">WORKBENCH</div>
        <div class="header-pill" id="workbench-status">ACTIVE</div>
        <a class="header-pill header-link" id="back-link" href="/app/workbenches">BACK</a>
      </div>
      <button type="button" class="user-badge" id="user-badge">COSMOS</button>
    </header>
    <div class="app-body">
      <aside class="sidebar" aria-label="Primary navigation"></aside>
      <main class="content-area">
        <section class="workbench-detail">
          <div class="workbench-hero" id="workbench-hero"></div>
          <h1 id="workbench-title">Workbench</h1>
          <p id="workbench-description"></p>
          <div class="module-grid" id="module-grid"></div>
        </section>
      </main>
    </div>
    <button type="button" class="maharshi-module" id="maharshi-module" title="Maharshi Bharadwaj">
      <img src="/assets/maharshi_bharadwaj.png" alt="Maharshi Bharadwaj" />
      <span>MAHARSHI BHARADWAJ</span>
    </button>
    <div class="status-bar in-frame" id="status-bar" role="status">
      <span class="status-indicator ready" aria-hidden="true"></span>
      <span class="status-bar-text">Workbench module</span>
      <span class="status-bar-meta">COSMOS 0.1</span>
    </div>
  </div>
  <script src="/assets/rbac.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/engineering-ux.js"></script>
  <script src="/assets/maharshi-popup.js"></script>
  <script>COSMOS.initWorkbenchDetail("__WORKBENCH_ID__");</script>
</body>
</html>
