<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COSMOS 0.1 — Login</title>
  <link rel="stylesheet" href="/assets/cosmos.css" />
</head>
<body class="cosmos-login">
  <div class="page-shell login-wrap">
    <form class="login-card" id="login-form">
      <input id="login-id" name="login_id" placeholder="LOGIN ID" autocomplete="username" required />
      <input id="password" name="password" type="password" placeholder="PASSWORD" autocomplete="current-password" required />
      <button type="submit" class="primary">LOG IN</button>
      <div class="error-text" id="login-error"></div>
    </form>
  </div>
  <div class="login-footer">
    <span>Copyright © 2026 COSMOS PVT LTD. All Rights Reserved.</span>
    <span>COSMOS_0.1</span>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("login-error");
      error.textContent = "";
      const payload = {
        login_id: document.getElementById("login-id").value,
        password: document.getElementById("password").value,
      };
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      if (!response.ok) {
        error.textContent = body.error || "Login failed.";
        return;
      }
      window.location.href = "/app/workbenches";
    });
  </script>
</body>
</html>
